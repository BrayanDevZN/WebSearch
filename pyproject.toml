[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websearch"
version = "0.1.0"
description = "Web search tool (Tavily-equivalent) for an AI research agent"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "trafilatura>=2.0",
    "selectolax>=0.3",
    "ddgs>=9",
    "pypdf>=4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
semantic = ["fastembed>=0.4", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: usa a rede real (desligado por padrão)"]
addopts = "-m 'not network'"
